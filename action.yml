name: 'AI CI Healer'
description: '🚑 Stops builds from failing. Analyzes logs & auto-fixes errors using AI (Groq/Gemini/Ollama).'
author: 'Mr. P @ QuizMyBrainz'

# The "Face" of your Action in the Marketplace
branding:
  icon: 'cpu'     # 'cpu' implies Intelligence/AI. 'tool' implies manual labor.
  color: 'purple' # The standard color for AI projects (implies magic/modern).

inputs:
  github-token:
    description: 'GitHub Token to post comments (use secrets.GITHUB_TOKEN)'
    required: true
  
  llm-provider:
    description: 'AI Brain to use: "groq" (fastest), "gemini" (smartest), or "ollama" (private)'
    required: false
    default: 'groq'
  
  model:
    description: 'Specific model to use (e.g., "llama-3.1-70b-versatile" or "gemini-1.5-flash")'
    required: false
    default: '' # Code handles defaults if empty
  
  groq-api-key:
    description: 'Groq API Key (Required if provider is groq)'
    required: false
  
  gemini-api-key:
    description: 'Gemini API Key (Required if provider is gemini)'
    required: false
  
  ollama-endpoint:
    description: 'Ollama Endpoint for self-hosted execution (e.g., http://localhost:11434)'
    required: false
  
  custom-context:
    description: 'Teach the AI your coding standards (e.g., "Always use TypeScript strict mode")'
    required: false
    default: ''
  
  max-log-lines:
    description: 'How much log history to read (Increase for complex errors)'
    required: false
    default: '500'
  
  confidence-threshold:
    description: 'Minimum confidence % required to post a comment'
    required: false
    default: '50'

  enable-comments:
    description: 'Post the fix as a comment on the PR? (true/false)'
    required: false
    default: 'true'

outputs:
  suggestion:
    description: 'The raw Markdown fix suggestion generated by AI'
  confidence:
    description: 'Confidence score (0-100)'
  error-type:
    description: 'Detected error category (e.g., build-error, test-failure)'

runs:
  using: 'node20'
  main: 'dist/index.js'